<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin — TuguiaTravel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="login-body d-flex align-items-center justify-content-center py-5">

    <div class="login-card bg-white p-4 p-md-5">

        <div class="login-logo"><i class="bi bi-map"></i></div>
        <div class="login-titulo">TuguiaTravel</div>
        <div class="login-sub">Panel de Administración</div>

        <div id="errorMsg" class="login-error d-none mb-3">
            <i class="bi bi-exclamation-circle me-2"></i><span id="errorText"></span>
        </div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label class="form-label fw-semibold" for="email">Correo electrónico</label>
                <div class="input-group">
                    <span class="input-group-text login-icon"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" class="form-control login-campo" placeholder="ingrese su correo electrónico"
                        required />
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold" for="password">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text login-icon"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" class="form-control login-campo" placeholder="••••••••"
                        required />
                </div>
            </div>
            <button type="submit" class="btn-login" id="btnLogin">
                <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
            </button>
        </form>
    </div>
    <script>
        // Si ya hay token, ir directo al dashboard
        if (localStorage.getItem('tg_token')) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');

            errorMsg.classList.add('d-none');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Ingresando...';

            try {
                const res = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Error al iniciar sesión');

                localStorage.setItem('tg_token', data.token);
                localStorage.setItem('tg_nombre', data.nombre);
                window.location.href = 'dashboard.html';

            } catch (err) {
                errorText.textContent = err.message;
                errorMsg.classList.remove('d-none');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Ingresar';
            }
        });
    </script>
</body>

</html>
